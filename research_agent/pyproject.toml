[project]
name = "research_agent"
version = "0.1.0"
description = "Query-driven research agent — substitution study across FRAMES/MoNaCo baselines"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    "openai>=1.40",
    "httpx>=0.27",
    "datasets>=2.20",
    "huggingface-hub>=0.25",
    "transformers>=4.45",
    "faiss-cpu>=1.8",
    "FlagEmbedding>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "rich>=13.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "tenacity>=8.3",
    "wikipedia>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
vllm = [
    "vllm>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
